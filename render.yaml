services:
  - type: web
    name: seatlock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Postgres URL in the Render dashboard
      - key: SEATLOCK_SECRET_KEY
        generateValue: true
      - key: SEATLOCK_JWT_SECRET
        generateValue: true
